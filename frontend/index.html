<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianAgent</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 400px; }
        h1 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; margin-bottom: 30px; }
        
        /* Custom File Input */
        input[type="file"] { display: none; }
        .custom-file-upload { border: 2px dashed #ccc; display: inline-block; padding: 20px 40px; cursor: pointer; width: 80%; border-radius: 8px; transition: 0.3s; }
        .custom-file-upload:hover { background: #f8f9fa; border-color: #1a73e8; }
        
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.2s; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #1557b0; }
        
        #status { margin-top: 20px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🛡️ GuardianAgent</h1>
        <p>Secure PII Redaction Pipeline</p>
        
        <label for="fileInput" class="custom-file-upload">
            Click to Select PDF
        </label>
        <input id="fileInput" type="file" accept=".pdf" onchange="updateLabel()" />
        <div id="fileName" style="margin-top:10px; color: #333;"></div>

        <button id="btn" onclick="processFile()">🔒 Redact & Download</button>
        
        <div id="status"></div>
    </div>

    <script>
        function updateLabel() {
            const file = document.getElementById('fileInput').files[0];
            if(file) document.getElementById('fileName').innerText = file.name;
        }

        async function processFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return alert("Please select a file first!");

            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            
            // UI Loading State
            btn.disabled = true;
            btn.innerText = "Processing on GPU...";
            status.innerText = "Extracting & Redacting...";
            status.style.color = "#e67c00"; // Orange

            const formData = new FormData();
            formData.append('pdf', file);

            try {
                // Replace with your Cloud Run Brain URL
                const response = await fetch('https://guardian-brain-672931600086.us-central1.run.app/redact-document', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Server Error");

                const blob = await response.blob();

                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "SAFE_" + file.name;
                document.body.appendChild(a);
                a.click();
                a.remove();

                status.innerText = "Success! Downloading Report.";
                status.style.color = "green";
                btn.innerText = "Done";

            } catch (error) {
                console.error(error);
                status.innerText = "Error: " + error.message;
                status.style.color = "red";
                btn.disabled = false;
                btn.innerText = "Try Again";
            }
        }
    </script>
</body>
</html>
